[package]
name = "gopher-mutant"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AST-based mutation testing for Go — the deepest operator set in the field"

[[bin]]
name = "gopher_mutant"
path = "src/main.rs"

[dependencies]
gopher-mutant-core = { path = "../gopher-mutant-core" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
